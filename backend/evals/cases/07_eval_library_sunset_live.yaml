name: spot_agent_evals
cases:
  - name: sample_sunset_loved_over_years
    inputs:
      prompt: play sunset vibes from songs I've loved over the years
      mode: live
      mock_spotify_profile: canonical_library
    metadata:
      feature: library_search
      group: sample_sunset
      canonical_library: true
      library_only: true
      check_type: judge
      live: true
      expect_grounded: true

