name: agent-eval-live-gemini

on:
  pull_request:
    paths:
      - "backend/spot_backend/**"
      - "backend/evals/**"
      - "scripts/run-live-evals.sh"
      - "Makefile"
      - ".github/workflows/agent-eval-live.yml"
  push:
    branches: [main]
    paths:
      - "backend/spot_backend/**"
      - "backend/evals/**"
      - "scripts/run-live-evals.sh"
      - ".github/workflows/agent-eval-live.yml"
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: agent-eval-live-gemini-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-eval-gemini:
    name: live-eval-gemini
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Reject fork pull requests
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::error::Live Gemini eval cannot run on fork PRs (repository secrets are not available)."
          exit 1

      - name: Require GEMINI_API_KEY secret
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "${GEMINI_API_KEY:-}" ]; then
            echo "::error::Repository secret GEMINI_API_KEY is required for live-eval-gemini."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Run live Gemini eval suite (mock Spotify per case)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DATA_DIR: /tmp/spot-live-eval
          REPORT_DIR: /tmp/spot-live-eval-reports
          SPOTIFY_CLIENT_ID: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          LLM_EVAL_PROVIDER: gemini
          LLM_PROVIDER: gemini
          EVAL_JUDGE_REPEAT: "2"
        run: ./scripts/run-live-evals.sh

      - name: Scan reports for API key leaks
        run: |
          python3 <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, "backend")
          from evals.key_leak_scan import find_key_leaks
          hits = []
          for p in Path("/tmp/spot-live-eval-reports").glob("*"):
              if p.is_file():
                  hits.extend(find_key_leaks(p.read_text(encoding="utf-8", errors="replace")))
          if hits:
              print("Key leak patterns found")
              sys.exit(1)
          print("Key leak scan: clean")
          PY

      - name: Upload live eval reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-eval-live-gemini-report
          path: |
            /tmp/spot-live-eval-reports/agent-eval-live-report_lib_off.json
            /tmp/spot-live-eval-reports/agent-eval-live-report_lib_on.json
            /tmp/spot-live-eval-reports/agent-eval-live-report_library_comparison.json
            /tmp/spot-live-eval-reports/agent-eval-live-report_library_comparison.md
            /tmp/spot-live-eval-reports/agent-eval-live-report.md
