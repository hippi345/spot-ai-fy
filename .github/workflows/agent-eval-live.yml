name: agent-eval-live

# PAUSED: Gemini API key rotation after leak report — re-enable when LIVE_GEMINI_EVAL_ENABLED=true.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * 0"
  pull_request:

jobs:
  live-eval:
    if: false # DISABLED: live Gemini eval paused until rotated GEMINI_API_KEY is confirmed in repo secrets.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Register secret masking (when re-enabled)
        if: false
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "${GEMINI_API_KEY:-}" ]; then
            echo "::add-mask::${GEMINI_API_KEY}"
          fi

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Check live eval prerequisites
        id: gate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          OLLAMA_HOST: ${{ secrets.OLLAMA_HOST }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: |
          echo "run=false" >> "$GITHUB_OUTPUT"

      - name: Run live agent eval suite
        if: false
        run: echo "live eval disabled"

      - name: Scan artifacts before upload
        if: false
        run: python3 scripts/ci_scan_artifacts_for_secrets.py /tmp/agent-eval-live-report.json

      - name: Upload live eval reports
        if: false # DISABLED: no live-eval artifacts until leak remediation complete.
        uses: actions/upload-artifact@v4
        with:
          name: agent-eval-live-report
          path: |
            /tmp/agent-eval-live-report.json
            /tmp/agent-eval-live-report.md
