name: agent-eval-live-gemini

# PAUSED: Gemini API key rotation after leak report — re-enable when LIVE_GEMINI_EVAL_ENABLED=true.
on:
  pull_request:
    paths:
      - "backend/spot_backend/**"
      - "backend/evals/**"
      - "scripts/run-live-evals.sh"
      - "Makefile"
      - ".github/workflows/agent-eval-live.yml"
  push:
    branches: [main]
    paths:
      - "backend/spot_backend/**"
      - "backend/evals/**"
      - "scripts/run-live-evals.sh"
      - ".github/workflows/agent-eval-live.yml"
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: agent-eval-live-gemini-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-eval-gemini:
    if: false # DISABLED: live Gemini eval paused until rotated GEMINI_API_KEY is confirmed in repo secrets.
    name: live-eval-gemini
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Register secret masking (when re-enabled)
        if: false
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "${GEMINI_API_KEY:-}" ]; then
            echo "::add-mask::${GEMINI_API_KEY}"
          fi

      - name: Reject fork pull requests
        if: false
        run: echo "disabled"

      - name: Require GEMINI_API_KEY secret
        if: false
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: echo "disabled"

      - uses: actions/setup-python@v5
        if: false
        with:
          python-version: "3.12"

      - name: Run live Gemini eval suite (mock Spotify per case)
        if: false
        run: echo "live eval disabled"

      - name: Scan artifacts before upload
        if: false
        run: python3 scripts/ci_scan_artifacts_for_secrets.py /tmp/spot-live-eval-reports

      - name: Upload live eval reports
        if: false # DISABLED: no live-eval artifacts until leak remediation complete.
        uses: actions/upload-artifact@v4
        with:
          name: agent-eval-live-gemini-report
          path: |
            /tmp/spot-live-eval-reports/agent-eval-live-report_lib_off.json
            /tmp/spot-live-eval-reports/agent-eval-live-report_lib_on.json
            /tmp/spot-live-eval-reports/agent-eval-live-report_library_comparison.json
            /tmp/spot-live-eval-reports/agent-eval-live-report_library_comparison.md
            /tmp/spot-live-eval-reports/agent-eval-live-report.md
