name: eval-gemini

# PAUSED: Gemini API key rotation after leak report.
on:
  workflow_dispatch:
  pull_request:

jobs:
  gemini-eval:
    if: false # DISABLED: real Gemini eval paused until rotated GEMINI_API_KEY is in repo secrets.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Mask Gemini secret (when re-enabled)
        if: false
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "${GEMINI_API_KEY:-}" ]; then
            echo "::add-mask::${GEMINI_API_KEY}"
          fi
      - name: Run Gemini eval (mocked Spotify)
        if: false
        run: echo "gemini eval disabled"
      - name: Scan artifacts before upload
        if: false
        run: python3 scripts/ci_scan_artifacts_for_secrets.py backend/tests/artifacts/gemini_eval_latest.json
      - name: Upload eval artifact
        if: false # DISABLED: no gemini-eval artifacts until leak remediation complete.
        uses: actions/upload-artifact@v4
        with:
          name: gemini-eval-json
          path: backend/tests/artifacts/gemini_eval_latest.json
          if-no-files-found: ignore
