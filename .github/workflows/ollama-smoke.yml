name: ollama-smoke

on:
  workflow_dispatch:
    inputs:
      model:
        description: Ollama model tag
        required: false
        default: qwen2.5:3b
  schedule:
    - cron: "0 6 * * *"

jobs:
  ollama-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Cache Ollama models
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-models-${{ runner.os }}-${{ inputs.model || 'qwen2.5:3b' }}-v1

      - name: Install and start Ollama (CPU)
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:11434/api/tags >/dev/null; then
              echo "Ollama is up"
              break
            fi
            sleep 2
          done
          curl -sf http://127.0.0.1:11434/api/tags

      - name: Pull model (with fallback)
        env:
          PRIMARY_MODEL: ${{ inputs.model || 'qwen2.5:3b' }}
        run: |
          set -e
          if ! ollama pull "$PRIMARY_MODEL"; then
            echo "Primary model unavailable; trying llama3.2:3b"
            PRIMARY_MODEL="llama3.2:3b"
            ollama pull "$PRIMARY_MODEL"
          fi
          echo "OLLAMA_MODEL=$PRIMARY_MODEL" >> "$GITHUB_ENV"

      - name: Run Ollama smoke pytest
        env:
          RUN_OLLAMA_SMOKE: "1"
          OLLAMA_HOST: http://127.0.0.1:11434
          OLLAMA_SMOKE_REPORT_PATH: ollama-smoke-report.json
          SPOT_AI_FY_DISABLE_DETERMINISTIC_CHAT: "1"
        run: |
          pytest backend/tests/test_ollama_smoke.py -m ollama_smoke -v --tb=short || true
          python backend/scripts/ollama_smoke_report_to_summary.py || true

      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ollama-smoke-report
          path: ollama-smoke-report.json
          if-no-files-found: warn
